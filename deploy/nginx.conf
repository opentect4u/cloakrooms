# /etc/nginx/sites-available/cloakroom  — TLS termination in front of the API on 127.0.0.1:4000.
# Certificates: certbot --nginx -d api.example.in
upstream cloakroom_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.in;

    ssl_certificate     /etc/letsencrypt/live/api.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Sync pushes may be up to 5 MB; logo uploads 200 KB.
    client_max_body_size 6m;

    # The API sets security headers (helmet) and compresses JSON itself.
    gzip off;

    # App keep-alive is 65 s, so Nginx (60 s) always closes idle upstream sockets first.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    keepalive_timeout 60s;

    location /api/ {
        proxy_pass http://cloakroom_api;
    }

    # APK downloads (the API sets Cache-Control / ETag).
    location /downloads/ {
        proxy_pass http://cloakroom_api;
        proxy_buffering on;
    }

    location / {
        return 404;
    }
}
